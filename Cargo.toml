[package]
name = "gfa"
version = "0.10.1"
authors = ["christian@chfi.se"]
edition = "2018"
license = "MIT"
description = "Library for working with graphs in the GFA (Graphical Fragment Assembly) format"
repository = "https://github.com/chfi/rs-gfa"
readme = "readme.md"
keywords = ["bioinformatics", "parser", "graph"]
categories = ["science"]

[features]
serde1 = ["serde", "serde_json", "bstr/serde"]

[dependencies]
libc = "0.2"
rayon = "1.10"
memchr = "2.7"
lazy_static = "1.5"
regex = "1.11"
nom = "5"
bytemuck = { version = "1.25", features = ["derive"] }
fnv = "1.0"
serde = { version = "1.0", features = ["derive"], optional =  true}
serde_json = { version = "1.0", optional = true }

anyhow = "1.0"
memmap2 = "0.9"

[dependencies.bstr]
version = "1.13"
default-features = false
# `trim` and friends moved behind "unicode" in bstr 1
features = ["std", "unicode"]

[dev-dependencies]
criterion = "0.3"
tempfile = "3.3.0"

[lib]
bench = false

[[bench]]
name = "parsing_benchmark"
harness = false
